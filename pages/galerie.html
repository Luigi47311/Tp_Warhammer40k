    <body id="top" class="bg-slate-950 text-stone-100">
        <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/90 backdrop-blur-xl">
            <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-4 sm:px-8">
                <a href="index.html" class="text-sm font-black uppercase tracking-widest text-amber-400 sm:text-base">Warhammer <span class="text-white">40,000</span></a>
                <div class="flex flex-wrap items-center justify-center gap-1 text-sm font-medium text-stone-300 sm:gap-2">
                    <a class="rounded-lg px-3 py-2 transition hover:bg-white/10 hover:text-amber-300" href="index.html">Accueil</a>

                <p class="mt-3 leading-7 text-stone-300">Sit web sur l'univer de Warhammer 40k, le 20 novembre 2026 au Cégep Saint-Jean-sur-Richelieu.</p>
                <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <article class="rounded-lg border border-white/10 bg-slate-800 p-4"><div class="mb-4 flex h-32 items-center justify-center rounded-lg bg-slate-700 text-sm text-stone-300">Portrait à ajouter</div><h3 class="text-lg font-bold">Manimékhala Nachampassak</h3><a class="mt-2 inline-block text-amber-300 underline hover:text-amber-200" href="mailto:adresse-a-ajouter@example.com">Écrire par courriel</a></article>
                    <article class="rounded-lg border border-white/10 bg-slate-800 p-4"><div class="mb-4 flex h-32 items-center justify-center rounded-lg bg-slate-700 text-sm text-stone-300">Portrait à ajouter</div><h3 class="text-lg font-bold">Tristan Pagé</h3><a class="mt-2 inline-block text-amber-300 underline hover:text-amber-200" href="mailto:adresse-a-ajouter@example.com">Écrire par courriel</a></article>
                </div>
                <form method="dialog" class="mt-6 text-right"><button type="submit" class="rounded-lg bg-amber-400 px-5 py-2 font-bold text-slate-950 hover:bg-amber-300">Fermer</button></form>
            </div>
        </dialog>
        <main class="mx-auto max-w-7xl px-5 py-16 sm:px-8">
            <h1 class="text-4xl font-black">Galerie</h1>
        </main>
